spring.application.name=designloop

# ---- Database (MySQL) ----
# Locally, this defaults to your local MySQL (localhost:3306, root/root).
# In production (e.g. Google Cloud Run), set these as environment
# variables instead of editing this file - see DEPLOY.md.
# createDatabaseIfNotExist=true means you do NOT need to manually create
# the "designloop" database first - Spring Boot will create it for you.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/designloop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# ddl-auto=update means Hibernate will automatically create/update the
# database tables to match our @Entity classes. Simple and fine for a
# small practice project like this.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- AI (Groq API) ----
# Get a free key at https://console.groq.com/keys, then set it as an
# environment variable before running the app, e.g.:
#   export GROQ_API_KEY=gsk_xxxxx   (Mac/Linux)
#   set GROQ_API_KEY=gsk_xxxxx      (Windows cmd)
# If left empty, the app still works - it just skips the AI part and
# shows only the deterministic (code-based) feedback.
groq.api.key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-120b

server.port=8080
